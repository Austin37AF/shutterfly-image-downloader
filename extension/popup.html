<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
    }
    h3 { margin: 0 0 12px 0; }
    #status { 
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    #token {
      width: 100%;
      height: 60px;
      font-family: monospace;
      font-size: 11px;
      resize: none;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #0056b3; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>
  <h3>Shutterfly Token</h3>
  <div id="status">Checking...</div>
  <textarea id="token" readonly></textarea>
  <button id="copy" disabled>Copy Token</button>
  <script src="popup.js"></script>
</body>
</html>
